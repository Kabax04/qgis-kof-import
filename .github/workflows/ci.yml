name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Python 3.9 finnes ikke for ubuntu-26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = QGIS 3.22-3.28, 3.12 = QGIS 3.34+
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest
