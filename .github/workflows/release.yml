name: Release

# Push a tag like v1.2.3 on main to publish that version:
# build the zip, create the GitHub Release and update plugins.xml on main,
# so QGIS installations using the custom repository get the update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "The tag must point to a commit on main"; exit 1; }
          python scripts/release.py check "$TAG"

      - name: Test
        run: |
          python -m pip install pytest flake8
          python -m flake8 kof_tools tests scripts
          python -m pytest

      - name: Create GitHub Release
        run: |
          zip=$(python scripts/release.py zip "$TAG" dist)
          python scripts/release.py notes "$TAG" > notes.md
          gh release create "$TAG" "$zip" --title "$TAG" --notes-file notes.md --verify-tag

      - name: Update plugins.xml on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch main
          git pull --ff-only
          python scripts/release.py xml "$TAG"
          git add plugins.xml
          git commit -m "chore: plugins.xml for $TAG"
          git push origin main
